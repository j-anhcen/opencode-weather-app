name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Resolver versión
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
      tag_exists: ${{ steps.version.outputs.tag_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer versión de package.json
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.version' package.json)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versión inválida en package.json: '$VERSION'"
            exit 1
          fi

          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "El release $TAG ya existe; no se publica nada."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "El release $TAG no existe; se publicará."
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.asset }})
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            built: weather
            asset: weather-linux-x64
          - os: macos-latest
            built: weather
            asset: weather-macos-arm64
          - os: windows-latest
            built: weather.exe
            asset: weather-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Tests y compilar binario
        run: bun run build

      - name: Renombrar binario
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.asset }}"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          pattern: weather-*
          path: artifacts
          merge-multiple: true

      - name: Restaurar permisos de ejecución
        run: chmod +x artifacts/weather-linux-x64 artifacts/weather-macos-arm64

      - name: Crear tag y release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          TAG_EXISTS: ${{ needs.version.outputs.tag_exists }}
        run: |
          set -euo pipefail

          TARGET_ARGS=()
          if [ "$TAG_EXISTS" != "true" ]; then
            TARGET_ARGS=(--target "$GITHUB_SHA")
          fi

          gh release create "$TAG" artifacts/* \
            --title "$TAG" \
            --generate-notes \
            "${TARGET_ARGS[@]}"

          echo "Release publicado: $TAG"
