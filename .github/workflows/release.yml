name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Resolver versión
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      needs_publish: ${{ steps.version.outputs.needs_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Leer versión y estado del release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.version' package.json)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versión inválida en package.json: '$VERSION'"
            exit 1
          fi

          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: $TAG"

          ASSETS=(weather-linux-x64 weather-macos-arm64 weather-windows-x64.exe)
          if gh release view "$TAG" --json assets --jq '.assets[].name' > /tmp/actual 2>/dev/null; then
            missing=0
            for asset in "${ASSETS[@]}"; do
              grep -qx "$asset" /tmp/actual || missing=1
            done
            if [ "$missing" -eq 0 ]; then
              echo "needs_publish=false" >> "$GITHUB_OUTPUT"
              echo "El release $TAG ya está completo; no se publica nada."
            else
              echo "needs_publish=true" >> "$GITHUB_OUTPUT"
              echo "El release $TAG existe pero está incompleto; se reparará."
            fi
          else
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
            echo "El release $TAG no existe; se publicará."
          fi

  publish:
    name: Compilar y publicar
    needs: version
    if: needs.version.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun test

      - name: Compilar binarios (cross-compile)
        run: |
          set -euo pipefail

          mkdir -p dist
          bun build --compile --target=bun-linux-x64    ./src/index.ts --outfile dist/weather-linux-x64
          bun build --compile --target=bun-darwin-arm64 ./src/index.ts --outfile dist/weather-macos-arm64
          bun build --compile --target=bun-windows-x64  ./src/index.ts --outfile dist/weather-windows-x64.exe

          file dist/*
          ls -l dist

      - name: Crear o reparar el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          publish() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/* --clobber
            else
              local target=()
              git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || target=(--target "$GITHUB_SHA")
              gh release create "$TAG" dist/* \
                --title "$TAG" \
                --generate-notes \
                "${target[@]}"
            fi
          }

          for attempt in 1 2 3; do
            if publish; then
              echo "Release publicado: $TAG"
              exit 0
            fi
            echo "::warning::Intento $attempt falló (posible error transitorio de GitHub)."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done

          echo "::error::No se pudo publicar $TAG tras 3 intentos."
          exit 1
